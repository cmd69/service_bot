services:
  servicebot:
    build: .
    container_name: servicebot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./texts:/app/texts:TEXTS_AUTO_RELOAD
    environment:
      - PYTHONUNBUFFERED=1
      # Configuración de textos
      - CUSTOM_TEXTS_PATH=${CUSTOM_TEXTS_PATH}
      - GENERIC_TEXTS_PATH=${GENERIC_TEXTS_PATH}
      - TEXTS_FALLBACK_TO_GENERIC=${TEXTS_FALLBACK_TO_GENERIC}
      - TEXTS_AUTO_RELOAD=${TEXTS_AUTO_RELOAD}
      - TEXTS_ENCODING=${TEXTS_ENCODING}
      - TEXTS_VERBOSE_LOGGING=${TEXTS_VERBOSE_LOGGING}
      # Configuración de base de datos
      - DATABASE_URL=${DATABASE_URL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - servicebot_mysql
    networks:
      - servicebot_network

  servicebot_mysql:
    image: mysql:8.0
    container_name: servicebot_mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - servicebot_mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - servicebot_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: servicebot_phpmyadmin
    restart: unless-stopped
    environment:
      - PMA_HOST=servicebot_mysql
      - PMA_PORT=3306
      - PMA_USER=${MYSQL_USER}
      - PMA_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - servicebot_mysql
    networks:
      - servicebot_network

  dbeaver:
    image: dbeaver/cloudbeaver:ea
    container_name: servicebot_dbeaver
    restart: unless-stopped
    ports:
      - "8081:8978"
    environment:
      - JAVA_OPTS=${DBEAVER_JAVA_OPTS}
      # Configuración de administrador
      - CB_ADMIN_NAME=${DBEAVER_ADMIN_NAME}
      - CB_ADMIN_PASSWORD=${DBEAVER_ADMIN_PASSWORD}
      # Configuración de base de datos
      - CB_DATABASE_URL=jdbc:mysql://servicebot_mysql:3306/${MYSQL_DATABASE}
      - CB_DATABASE_USER=${MYSQL_USER}
      - CB_DATABASE_PASSWORD=${MYSQL_PASSWORD}
      - CB_DATABASE_DRIVER=mysql
      # Configuración adicional
      - CB_SERVER_NAME=ServiceBot Database
      - CB_SERVER_URL=http://localhost:8081
    volumes:
      - servicebot_dbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      - servicebot_mysql
    networks:
      - servicebot_network


volumes:
  servicebot_mysql_data:
  servicebot_dbeaver_data:

networks:
  servicebot_network:
    driver: bridge